<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Details | Elite Workforce Solutions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #17233a; margin: 0; padding: 20px; }
  .profile-card { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #e7ebf0; }
  .profile-header { background: linear-gradient(135deg, #061b3a, #0b3d91); color: #fff; padding: 30px; text-align: center; position: relative; }
  .profile-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; margin: 0 auto 15px auto; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #0b3d91; font-weight: bold; }
  .profile-body { padding: 30px; }
  .info-group { margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; }
  .info-label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
  .info-value { font-size: 16px; font-weight: 600; color: #1e293b; }
  .whatsapp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #25d366; color: #fff; font-weight: 800; padding: 12px 20px; border-radius: 8px; width: 100%; text-align: center; margin-top: 15px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); transition: 0.2s; }
  .whatsapp-btn:hover { background: #20ba5a; transform: translateY(-2px); }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: #f1f5f9; color: #475569; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; margin-bottom: 20px; text-decoration: none; transition: 0.2s; }
  .back-btn:hover { background: #e2e8f0; color: #1e293b; }
</style>
</head>
<body>

<div class="max-w-[600px] mx-auto">
  <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<div class="profile-card" id="profileCardContainer">
  <div class="profile-header">
    <div id="avatarContainer" class="profile-avatar">
      <i class="fa-solid fa-user"></i>
    </div>
    <h1 id="profileTitle" class="text-2xl font-extrabold text-white">Loading Profile...</h1>
    <p id="profileRoleSubtitle" class="text-amber-300 font-semibold text-sm mt-1">Please wait</p>
  </div>

  <div class="profile-body" id="profileDetailsBody">
    <p class="text-center text-gray-500 py-6">Loading details from database...</p>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const profileType = localStorage.getItem('selected_profile_type');
    const profileDataRaw = localStorage.getItem('selected_profile_data');

    const titleEl = document.getElementById('profileTitle');
    const subtitleEl = document.getElementById('profileRoleSubtitle');
    const avatarEl = document.getElementById('avatarContainer');
    const bodyEl = document.getElementById('profileDetailsBody');

    if (!profileDataRaw) {
      titleEl.innerText = "No Profile Found";
      subtitleEl.innerText = "Error";
      bodyEl.innerHTML = `<p class="text-center text-red-500 py-4">Koi profile data select nahi kiya gaya hai. Kripya Home page par wapas jayein.</p>`;
      return;
    }

    const data = JSON.parse(profileDataRaw);

    if (profileType === 'azad_workers') {
      titleEl.innerText = data.full_name || 'Worker Profile';
      subtitleEl.innerText = `Trade / Skill: ${(data.trade || 'General Worker').toUpperCase()}`;
      
      if (data.file_uri) {
        avatarEl.innerHTML = `<img src="${data.file_uri}" class="w-full h-full object-cover rounded-full">`;
      } else {
        avatarEl.innerText = (data.full_name || 'W').charAt(0).toUpperCase();
      }

      const cleanPhone = data.phone_number ? data.phone_number.replace(/[^0-9]/g, '') : '';

      bodyEl.innerHTML = `
        <div class="info-group">
          <div class="info-label">Full Name</div>
          <div class="info-value">${data.full_name || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Email Address</div>
          <div class="info-value">${data.email || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Phone / WhatsApp Number</div>
          <div class="info-value">${data.phone_number || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Trade / Expertise</div>
          <div class="info-value text-blue-600 font-bold">${data.trade || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Emirate / Location</div>
          <div class="info-value">${data.location || 'UAE'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Registration Date</div>
          <div class="info-value">${data.created_at ? new Date(data.created_at).toLocaleDateString() : 'N/A'}</div>
        </div>
        <a href="https://wa.me/${cleanPhone}" target="_blank" class="whatsapp-btn">
          <i class="fa-brands fa-whatsapp text-xl"></i> Connect with Worker on WhatsApp
        </a>
      `;

    } else if (profileType === 'suppliers') {
      titleEl.innerText = data.company_name || 'Supplier Company';
      subtitleEl.innerText = `Trade License: ${data.trade_license || 'Verified Supplier'}`;

      if (data.logo_url) {
        avatarEl.innerHTML = `<img src="${data.logo_url}" class="w-full h-full object-contain rounded-full bg-white p-1">`;
      } else {
        avatarEl.innerText = (data.company_name || 'S').charAt(0).toUpperCase();
      }

      const cleanPhone = data.phone ? data.phone.replace(/[^0-9]/g, '') : '';

      bodyEl.innerHTML = `
        <div class="info-group">
          <div class="info-label">Supplier / Company Name</div>
          <div class="info-value">${data.company_name || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Trade License Number</div>
          <div class="info-value font-mono text-blue-600">${data.trade_license || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Contact Person</div>
          <div class="info-value">${data.contact_person || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Email Address</div>
          <div class="info-value">${data.email || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Phone / WhatsApp</div>
          <div class="info-value">${data.phone || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Manpower Categories</div>
          <div class="info-value">${data.manpower_types || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Workers Available</div>
          <div class="info-value text-emerald-600 font-bold">${data.workers_available || 'Multiple'} Workers</div>
        </div>
        <a href="https://wa.me/${cleanPhone}" target="_blank" class="whatsapp-btn">
          <i class="fa-brands fa-whatsapp text-xl"></i> Contact Supplier on WhatsApp
        </a>
      `;

    } else if (profileType === 'companies') {
      titleEl.innerText = data.company_name || 'Client Company';
      subtitleEl.innerText = `Requirement Location: ${data.location || 'UAE'}`;

      if (data.logo_url) {
        avatarEl.innerHTML = `<img src="${data.logo_url}" class="w-full h-full object-contain rounded-full bg-white p-1">`;
      } else {
        avatarEl.innerText = (data.company_name || 'C').charAt(0).toUpperCase();
      }

      const cleanPhone = data.phone ? data.phone.replace(/[^0-9]/g, '') : '';

      bodyEl.innerHTML = `
        <div class="info-group">
          <div class="info-label">Company Name</div>
          <div class="info-value">${data.company_name || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Trade License</div>
          <div class="info-value font-mono text-blue-600">${data.trade_license || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Contact Person</div>
          <div class="info-value">${data.contact_person || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Email Address</div>
          <div class="info-value">${data.email || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Phone / WhatsApp</div>
          <div class="info-value">${data.phone || 'N/A'}</div>
        </div>
        <div class="info-group">
          <div class="info-label">Requirement Details</div>
          <div class="info-value text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-200 mt-1">${data.requirement_details || 'N/A'}</div>
        </div>
        <a href="https://wa.me/${cleanPhone}" target="_blank" class="whatsapp-btn">
          <i class="fa-brands fa-whatsapp text-xl"></i> Chat with Company on WhatsApp
        </a>
      `;
    }
  });
</script>

</body>
</html>
