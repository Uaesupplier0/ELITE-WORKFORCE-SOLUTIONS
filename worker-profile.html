
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Details - Elite Workforce Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
    <a href="index.html" class="text-blue-900 font-bold text-lg">ELITE <b>WORKFORCE</b></a>
    <a href="index.html" class="text-sm font-semibold text-blue-600 hover:underline"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  </header>

  <main class="container mx-auto max-w-2xl p-6 my-auto">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
      <div class="flex items-center gap-4 mb-6 pb-6 border-b border-slate-100">
        <div id="profileAvatar" class="w-16 h-16 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl font-bold overflow-hidden">
          <!-- Logo or Initials -->
        </div>
        <div>
          <h1 id="profileTitle" class="text-2xl font-extrabold text-slate-900">Loading...</h1>
          <p id="profileSubtitle" class="text-sm text-slate-500">Profile Details & Information</p>
        </div>
      </div>

      <div id="profileDetails" class="space-y-4 text-sm">
        <!-- Dynamic content injected here -->
      </div>

      <div class="mt-8 pt-6 border-t border-slate-100 flex gap-4">
        <a id="whatsappBtn" href="#" target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-center transition flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-lg"></i> Direct WhatsApp
        </a>
        <a href="index.html" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-center transition">
          Close
        </a>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-400">
    &copy; 2026 Elite Workforce Solutions. All rights reserved.
  </footer>

  <script>
    const type = new URLSearchParams(window.location.search).get('type');
    const rawData = localStorage.getItem('selected_profile_data');

    if (!rawData) {
      document.getElementById('profileTitle').innerText = "No Data Found";
      document.getElementById('profileDetails').innerHTML = "<p>Please go back and select a valid record from the table.</p>";
    } else {
      const data = JSON.parse(rawData);
      const avatarContainer = document.getElementById('profileAvatar');
      const titleEl = document.getElementById('profileTitle');
      const subtitleEl = document.getElementById('profileSubtitle');
      const detailsEl = document.getElementById('profileDetails');
      const waBtn = document.getElementById('whatsappBtn');

      if (type === 'azad_workers') {
        titleEl.innerText = data.full_name;
        subtitleEl.innerText = `Skilled Trade: ${data.trade || 'Worker'}`;
        if (data.file_uri) {
          avatarContainer.innerHTML = `<img src="${data.file_uri}" class="w-full h-full object-cover">`;
        } else {
          avatarContainer.innerText = data.full_name.charAt(0);
        }

        detailsEl.innerHTML = `
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Email:</span> <span>${data.email || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Phone Number:</span> <span>${data.phone_number || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Trade / Skill:</span> <span class="font-bold text-blue-600">${data.trade}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Location / Emirate:</span> <span>${data.location}</span></div>
          <div class="flex justify-between py-2"><span class="font-semibold text-slate-500">Registration Date:</span> <span>${new Date(data.created_at).toLocaleDateString()}</span></div>
        `;
        const phone = data.phone_number ? data.phone_number.replace(/[^0-9]/g, '') : '';
        waBtn.href = `https://wa.me/${phone}`;

      } else if (type === 'suppliers') {
        titleEl.innerText = data.company_name;
        subtitleEl.innerText = `Manpower Supplier (Lic: ${data.trade_license || 'N/A'})`;
        if (data.logo_url) {
          avatarContainer.innerHTML = `<img src="${data.logo_url}" class="w-full h-full object-contain p-1">`;
        } else {
          avatarContainer.innerText = data.company_name.charAt(0);
        }

        detailsEl.innerHTML = `
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Contact Person:</span> <span>${data.contact_person || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Email:</span> <span>${data.email || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Phone / WhatsApp:</span> <span>${data.phone || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Manpower Categories:</span> <span class="font-bold text-blue-600">${data.manpower_types || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Available Workers:</span> <span class="font-bold">${data.workers_available || 'Multiple'}</span></div>
          <div class="flex justify-between py-2"><span class="font-semibold text-slate-500">Registered On:</span> <span>${new Date(data.created_at).toLocaleDateString()}</span></div>
        `;
        const phone = data.phone ? data.phone.replace(/[^0-9]/g, '') : '';
        waBtn.href = `https://wa.me/${phone}`;

      } else if (type === 'companies') {
        titleEl.innerText = data.company_name;
        subtitleEl.innerText = `Active Requirement (Lic: ${data.trade_license || 'N/A'})`;
        if (data.logo_url) {
          avatarContainer.innerHTML = `<img src="${data.logo_url}" class="w-full h-full object-contain p-1">`;
        } else {
          avatarContainer.innerText = data.company_name.charAt(0);
        }

        detailsEl.innerHTML = `
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Contact Person:</span> <span>${data.contact_person || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Email:</span> <span>${data.email || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Phone / WhatsApp:</span> <span>${data.phone || 'N/A'}</span></div>
          <div class="flex justify-between py-2 border-b border-slate-50"><span class="font-semibold text-slate-500">Location:</span> <span>${data.location || 'UAE'}</span></div>
          <div class="py-2 border-b border-slate-50"><span class="font-semibold text-slate-500 block mb-1">Requirement Details:</span> <p class="bg-slate-50 p-3 rounded-lg text-slate-700">${data.requirement_details || 'N/A'}</p></div>
          <div class="flex justify-between py-2"><span class="font-semibold text-slate-500">Posted On:</span> <span>${new Date(data.created_at).toLocaleDateString()}</span></div>
        `;
        const phone = data.phone ? data.phone.replace(/[^0-9]/g, '') : '';
        waBtn.href = `https://wa.me/${phone}`;
      }
    }
  </script>
</body>
</html>
